<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ToDo Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .task { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .completed { background-color: #e8f5e9; }
        .pending { background-color: #fff3e0; }
        .category-badge { background: #2196F3; color: white; padding: 2px 6px; border-radius: 3px; font-size: 0.8em; }
        form { margin-top: 10px; }
        input, select { margin: 5px 0; padding: 5px; }
    </style>
</head>
<body>
<h1>ToDo List</h1>

<div th:each="task : ${tasks}" class="task" th:classappend="${task.completed} ? 'completed' : 'pending'">
    <h3>
        <span th:text="${task.title}">Title</span>
        <span class="category-badge" th:text="${task.category}">Category</span>
    </h3>
    <p th:text="${task.description}">Description</p>
    <p>
        Статус: <strong th:text="${task.completed ? 'Выполнено' : 'В процессе'}">Status</strong>
    </p>

    <a th:href="@{/deleteTask/{id}(id=${task.id})}">Удалить</a>

    <form th:action="@{/updateTask/{id}(id=${task.id})}" method="post" style="display:inline;">
        <input type="hidden" name="completed" value="true">
        <button type="submit" th:if="${!task.completed}">Отметить как выполненное</button>
    </form>
</div>

<hr>
<h2>Добавить новую задачу</h2>
<form th:action="@{/addTask}" method="post">
    <div>
        <label for="title">Название:</label><br>
        <input type="text" id="title" name="title" required>
    </div>
    <div>
        <label for="description">Описание:</label><br>
        <input type="text" id="description" name="description" required>
    </div>
    <div>
        <label for="category">Категория:</label><br>
        <select id="category" name="category">
            <option value="Учеба">Учеба</option>
            <option value="Работа">Работа</option>
            <option value="Личные дела">Личные дела</option>
        </select>
    </div>
    <button type="submit" style="margin-top: 10px;">Добавить задачу</button>
</form>
</body>
</html>
